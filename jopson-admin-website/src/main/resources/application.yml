spring:
  application:
    name: jopson-admin-website
  cache:
    type: caffeine
  datasource:
    url: ${JOPSON_DB_URL:}
    username: ${JOPSON_DB_USER:}
    password: ${JOPSON_DB_PASSWORD:}

server:
  servlet:
    session:
      timeout: 30m
      persistent: false
      cookie:
        http-only: true
        same-site: lax
        secure: ${JOPSON_COOKIE_SECURE:true}
