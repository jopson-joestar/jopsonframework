spring:
  application:
    name: jorsy-admin-website
  cache:
    type: caffeine
  datasource:
    url: ${JORSY_DB_URL:}
    username: ${JORSY_DB_USER:}
    password: ${JORSY_DB_PASSWORD:}

server:
  servlet:
    session:
      timeout: 30m
      persistent: false
      cookie:
        http-only: true
        same-site: lax
        secure: ${JORSY_COOKIE_SECURE:true}
